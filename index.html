<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore chatbots and play Tic-Tac-Toe in two classroom AI labs.">
  <title>AI Lesson Demos</title>
  <style>
    :root {
      color-scheme: light;
      color: #241e34;
      background: #f5f2fa;
      font: 100%/1.5 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --ink: #241e34;
      --accent: #4d2eb0;
      --muted: #575167;
      --gold: #ffc63e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; }
    main { width: min(100% - 28px, 990px); margin: 40px auto; }
    header { margin-bottom: 32px; text-align: center; }
    h1 {
      margin: 0 0 10px;
      color: var(--accent);
      font: 900 clamp(2.65rem, 7.5vw, 4.5rem)/1.08 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: -.045em;
      -webkit-text-stroke: 2px #fff;
      paint-order: stroke fill;
      text-shadow: 3px 4px 0 #fff, 6px 8px 0 #241e3433;
    }
    .title-accent { color: #109d8f; }
    header p { margin: 0; color: var(--muted); font-size: 1rem; }
    .demos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .demo {
      --card-background: #faf7ff;
      --card-tint: #ede0fd;
      --card-edge: #7251a6;
      --card-ink: #4c2d80;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 0;
      padding: 28px;
      border: 2px solid var(--card-edge);
      border-radius: 17px;
      background: var(--card-background);
      box-shadow: 0 5px 0 var(--card-tint);
      color: var(--ink);
      text-decoration: none;
      transition: background-color 160ms, box-shadow 160ms;
    }
    .demo:hover { background: #f1ebfd; box-shadow: 0 5px 0 var(--card-edge); }
    .demo:focus-visible { outline: 3px solid #168578; outline-offset: 5px; }
    .game {
      --card-background: #f4fbf7;
      --card-tint: #d9f1e3;
      --card-edge: #428467;
      --card-ink: #245940;
    }
    .game:hover { background: #e8f6ee; }
    .icon {
      display: grid;
      place-items: center;
      width: 88px;
      height: 88px;
      margin-bottom: 20px;
    }
    .icon img { display: block; width: 88px; height: auto; }
    .game .icon {
      width: 72px;
      height: 72px;
      margin: 8px 0 28px;
      border: 2px solid var(--card-edge);
      border-radius: 14px;
      background: #d9f1e3;
      box-shadow: 0 3px 0 #241e342b;
      color: var(--card-ink);
    }
    .icon svg { width: 40px; height: 40px; }
    h2 { margin: 0 0 8px; color: var(--card-ink); font-size: 1.5rem; font-weight: 800; line-height: 1.3; }
    .demo p { margin: 0 0 28px; color: var(--muted); font-size: 1rem; }
    .open {
      margin-top: auto;
      padding: 8px 16px;
      border: 2px solid var(--ink);
      border-radius: 9px;
      background: var(--gold);
      box-shadow: 0 2px 0 #241e3455;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 800;
    }
    .demo:hover .open { background: #ffd56a; }
    footer { margin-top: 24px; color: var(--muted); font-size: .875rem; text-align: center; }
    @media (max-width: 600px) {
      main { margin: 28px auto; }
      header { margin-bottom: 28px; }
      .demos { grid-template-columns: 1fr; gap: 20px; }
      .demo { padding: 24px; }
    }
    @media (prefers-reduced-motion: reduce) { .demo { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI Lesson <span class="title-accent">Demos</span></h1>
      <p>Choose a demo to get started.</p>
    </header>
    <nav class="demos" aria-label="Classroom demos">
      <a class="demo" href="./eliza/index.html">
        <span class="icon" aria-hidden="true">
          <img src="./eliza/chatbot-assets/chat-robot.png" alt="" width="112" height="106">
        </span>
        <h2>Chatbot Lab</h2>
        <p>Chat with ELIZA, explore its rules, and compare with modern AI.</p>
        <span class="open">Open Chatbot Lab</span>
      </a>
      <a class="demo game" href="./tic-tac-toe/index.html">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3v26M21 3v26M3 12h26M3 21h26M4 4l5 5M9 4 4 9M23 23l5 5M28 23l-5 5"/>
            <circle cx="16.5" cy="16.5" r="2.5"/>
          </svg>
        </span>
        <h2>Tic-Tac-Toe Lab</h2>
        <p>Play against different AI strategies and see how they choose their moves.</p>
        <span class="open">Open Tic-Tac-Toe Lab</span>
      </a>
    </nav>
    <footer>CUHK-JC AI FOR THE FUTURE</footer>
  </main>
</body>
</html>
